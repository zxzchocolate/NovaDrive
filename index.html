<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaDrive</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b0d0e;color:#d7d9da;font-family:"SFMono-Regular","JetBrains Mono","Cascadia Code",monospace;font-size:14px}
body{padding:0}
#app{width:100%;height:100%;display:flex;flex-direction:column}
#tabs{height:36px;background:#111315;border-bottom:1px solid #292d30;display:flex;align-items:stretch;padding:0 6px;gap:2px}
.tab{height:36px;min-width:150px;max-width:240px;background:#111315;color:#777d81;border:0;border-right:1px solid #292d30;display:flex;align-items:center;padding:0 8px;cursor:pointer}
.tab:hover{background:#171a1c;color:#aaa}
.tab.active{background:#0b0d0e;color:#d7d9da}
.tab-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-close{width:22px;text-align:center;color:#666;background:transparent;border:0;padding:0;font:inherit}
.tab-close:hover{color:#ff6b6b}
#newTab{height:36px;width:36px;background:transparent;border:0;color:#777d81;font:inherit;font-size:18px;cursor:pointer}
#newTab:hover{background:#171a1c;color:#9fef00}
#terminals{flex:1;min-height:0;position:relative}
.terminal{display:none;width:100%;height:100%;overflow:auto;padding:20px}
.terminal.active{display:block}
.line{min-height:24px;line-height:24px;white-space:pre-wrap;word-break:break-word}
.prompt{color:#9fef00}
.dim{color:#666}
.file{cursor:pointer}
.file:hover{background:#171b1d}
.selected{background:#1d2920;color:#9fef00}
.dir{color:#8ab4f8}
.error{color:#ff6b6b}
.inputline{display:flex;align-items:center}
input{flex:1;background:transparent;border:0;outline:0;color:#d7d9da;font:inherit;padding:0;margin:0}
input::placeholder{color:#555}
.drop{position:fixed;inset:0;background:#0b0d0e;display:none;align-items:center;justify-content:center;color:#9fef00;font-size:18px;z-index:100}
.drop.active{display:flex}
</style>
</head>
<body>

<div id="app">

<div id="tabs">
<button id="newTab">+</button>
</div>

<div id="terminals"></div>

</div>

<div id="drop" class="drop">DROP FILES HERE</div>

<script>
let tabs=[];
let activeTab=0;
let nextTabId=1;

function createTab(){
const tab={
id:nextTabId++,
name:"Terminal "+nextTabId,
path:".",
files:[],
selected:null,
history:[],
historyIndex:0
};

tabs.push(tab);
activeTab=tabs.length-1;
renderTabs();
renderTerminals();
load();
}

function closeTab(index){
if(tabs.length===1)return;

tabs.splice(index,1);

if(activeTab>=tabs.length){
activeTab=tabs.length-1;
}

renderTabs();
renderTerminals();
}

function switchTab(index){
activeTab=index;
renderTabs();
renderTerminals();
}

function current(){
return tabs[activeTab];
}

function renderTabs(){
const tabsBar=document.getElementById("tabs");
tabsBar.innerHTML="";

tabs.forEach((tab,index)=>{
const element=document.createElement("div");
element.className="tab"+(index===activeTab?" active":"");

const name=document.createElement("span");
name.className="tab-name";
name.textContent=tab.name;

const close=document.createElement("button");
close.className="tab-close";
close.textContent="×";

close.onclick=e=>{
e.stopPropagation();
closeTab(index);
};

element.appendChild(name);
element.appendChild(close);

element.onclick=()=>{
switchTab(index);
};

tabsBar.appendChild(element);
});

const plus=document.createElement("button");
plus.id="newTab";
plus.textContent="+";
plus.onclick=createTab;
tabsBar.appendChild(plus);
}

function renderTerminals(){
const container=document.getElementById("terminals");
container.innerHTML="";

tabs.forEach((tab,index)=>{
const terminal=document.createElement("div");

terminal.className="terminal"+
(index===activeTab?" active":"");

terminal.id="terminal-"+tab.id;

container.appendChild(terminal);
});

renderCurrent();
}

function terminalElement(){
return document.getElementById(
"terminal-"+current().id
);
}

function pathText(){
const tab=current();

return tab.path==="."
?"~"
:"~/"+tab.path.replace(/^\.?\//,"");
}

function print(text="",className=""){
const terminal=terminalElement();

const line=document.createElement("div");
line.className="line "+className;
line.textContent=text;

terminal.appendChild(line);

terminal.scrollTop=terminal.scrollHeight;
}

function promptLine(text){
const terminal=terminalElement();

const line=document.createElement("div");
line.className="line";

line.innerHTML=
'<span class="prompt">nova@novadrive</span>'+
'<span class="dim">:</span>'+
escapeHTML(pathText())+
'<span class="dim">$ </span>'+
escapeHTML(text);

terminal.appendChild(line);

terminal.scrollTop=terminal.scrollHeight;
}

function createInput(){
const terminal=terminalElement();

const inputLine=document.createElement("div");
inputLine.className="inputline";

const prompt=document.createElement("span");
prompt.className="prompt";
prompt.textContent="nova@novadrive";

const colon=document.createElement("span");
colon.className="dim";
colon.textContent=":"+pathText()+"$ ";

const input=document.createElement("input");
input.autocomplete="off";
input.spellcheck=false;
input.placeholder="type help";

input.addEventListener("keydown",async e=>{
const tab=current();

if(e.key==="Enter"){
const value=input.value;
input.value="";
await run(value);
}

if(e.key==="ArrowUp"){
if(tab.historyIndex>0){
tab.historyIndex--;
input.value=tab.history[tab.historyIndex];
}
}

if(e.key==="ArrowDown"){
if(tab.historyIndex<tab.history.length-1){
tab.historyIndex++;
input.value=tab.history[tab.historyIndex];
}else{
tab.historyIndex=tab.history.length;
input.value="";
}
}
});

inputLine.appendChild(prompt);
inputLine.appendChild(colon);
inputLine.appendChild(input);

terminal.appendChild(inputLine);

setTimeout(()=>input.focus(),0);
}

function escapeHTML(text){
return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function nameOf(file){
return file.name||file.filename||"unknown";
}

function pathOf(file){
return file.path||file.fullPath||nameOf(file);
}

function isDir(file){
return file.is_dir===true||
file.isDirectory===true||
file.type==="directory";
}

function sizeOf(file){
let size=Number(file.size||0);

if(!size)return "-";

const units=["B","KB","MB","GB","TB"];
let i=0;

while(size>=1024&&i<units.length-1){
size/=1024;
i++;
}

return size.toFixed(size>=10?0:1)+" "+units[i];
}

async function load(){
const tab=current();

try{
tab.files=await puter.fs.readdir(tab.path);
renderCurrent();
}catch(e){
print(
"error: "+(e.message||"unable to read directory"),
"error"
);
}
}

function renderCurrent(){
const tab=current();
const terminal=terminalElement();

terminal.innerHTML="";

print("NovaDrive");
print("");

if(!tab.files.length){
print("empty directory","dim");
}else{
tab.files.forEach((file,index)=>{
const line=document.createElement("div");

line.className="line file";

if(tab.selected===index){
line.classList.add("selected");
}

const name=nameOf(file);

line.textContent=
(isDir(file)?"[DIR] ":"      ")+
name+
(isDir(file)?"/":"")+
"    "+
sizeOf(file);

line.onclick=()=>{
tab.selected=index;
renderCurrent();
};

line.ondblclick=()=>{
openFile(file);
};

terminal.appendChild(line);
});
}

print("");

createInput();
}

async function openFile(file){
const tab=current();

if(isDir(file)){
tab.path=
tab.path==="."
?nameOf(file)
:tab.path+"/"+nameOf(file);

tab.selected=null;

updateTabName();

await load();

return;
}

try{
const url=
await puter.fs.getReadURL(pathOf(file));

window.open(url,"_blank");
}catch(e){
print(
"error: "+(e.message||"cannot open file"),
"error"
);
}
}

function updateTabName(){
const tab=current();

const tabElement=
document.querySelectorAll(".tab")[activeTab];

if(tabElement){
const name=tabElement.querySelector(".tab-name");

name.textContent=
tab.path==="."
?"Terminal"
:"~/"+tab.path;
}
}

async function upload(){
const tab=current();

const input=document.createElement("input");

input.type="file";
input.multiple=true;

input.onchange=async()=>{
for(const file of input.files){
try{
await puter.fs.upload(
file,
tab.path,
{dedupeName:true}
);

print("uploaded: "+file.name);
}catch(e){
print(
"error: "+(e.message||"upload failed"),
"error"
);
}
}

await load();
};

input.click();
}

async function mkdir(name){
const tab=current();

if(!name){
print("usage: mkdir <name>","error");
return;
}

try{
await puter.fs.mkdir(
tab.path==="."
?name
:tab.path+"/"+name
);

print("created: "+name);

await load();
}catch(e){
print(
"error: "+(e.message||"mkdir failed"),
"error"
);
}
}

async function remove(){
const tab=current();

if(tab.selected===null){
print("no file selected","error");
return;
}

const file=tab.files[tab.selected];

try{
await puter.fs.delete(pathOf(file));

print("removed: "+nameOf(file));

tab.selected=null;

await load();
}catch(e){
print(
"error: "+(e.message||"remove failed"),
"error"
);
}
}

async function renameFile(name){
const tab=current();

if(tab.selected===null){
print("no file selected","error");
return;
}

if(!name){
print("usage: rename <new-name>","error");
return;
}

const file=tab.files[tab.selected];

const parent=
tab.path==="."
?""
:tab.path+"/";

try{
await puter.fs.rename(
pathOf(file),
parent+name
);

tab.selected=null;

await load();
}catch(e){
print(
"error: "+(e.message||"rename failed"),
"error"
);
}
}

function help(){
print("help");
print("ls                 list files");
print("cd <dir>           enter directory");
print("cd ..              go back");
print("open               open selected file");
print("upload             upload files");
print("mkdir <name>       create directory");
print("rename <name>      rename selected file");
print("rm                 delete selected file");
print("clear              clear terminal");
print("pwd                show current path");
print("newtab             open new tab");
print("closetab           close current tab");
print("help               show commands");
}

async function run(raw){
const input=raw.trim();

if(!input)return;

const tab=current();

tab.history.push(input);
tab.historyIndex=tab.history.length;

promptLine(input);

const parts=input.split(/\s+/);
const cmd=parts.shift().toLowerCase();
const arg=parts.join(" ");

if(cmd==="help"){
help();
}else if(cmd==="ls"){
await load();
}else if(cmd==="pwd"){
print(
tab.path==="."
?"/"
:"/"+tab.path
);
}else if(cmd==="clear"){
renderCurrent();
}else if(cmd==="upload"){
await upload();
}else if(cmd==="mkdir"){
await mkdir(arg);
}else if(cmd==="rename"){
await renameFile(arg);
}else if(cmd==="rm"){
await remove();
}else if(cmd==="open"){
if(tab.selected!==null){
await openFile(tab.files[tab.selected]);
}else{
print("no file selected","error");
}
}else if(cmd==="newtab"){
createTab();
}else if(cmd==="closetab"){
closeTab(activeTab);
}else if(cmd==="cd"){
if(!arg){
tab.path=".";
}else if(arg===".."){
if(
tab.path!=="."&&
tab.path.includes("/")
){
tab.path=
tab.path
.split("/")
.slice(0,-1)
.join("/")||".";
}else{
tab.path=".";
}
}else{
tab.path=
tab.path==="."
?arg
:tab.path+"/"+arg;
}

tab.selected=null;

updateTabName();

await load();
}else{
print(
"command not found: "+cmd,
"error"
);
}
}

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey||e.metaKey)&&
e.key.toLowerCase()==="t"
){
e.preventDefault();
createTab();
}

if(
(e.ctrlKey||e.metaKey)&&
e.key.toLowerCase()==="w"
){
e.preventDefault();

if(tabs.length>1){
closeTab(activeTab);
}
}
});

const drop=document.getElementById("drop");

document.addEventListener("dragenter",e=>{
if(
e.dataTransfer&&
Array.from(e.dataTransfer.types)
.includes("Files")
){
drop.classList.add("active");
}
});

document.addEventListener(
"dragover",
e=>e.preventDefault()
);

document.addEventListener(
"dragleave",
e=>{
if(
e.clientX<=0||
e.clientY<=0||
e.clientX>=window.innerWidth||
e.clientY>=window.innerHeight
){
drop.classList.remove("active");
}
});

document.addEventListener(
"drop",
async e=>{
e.preventDefault();

drop.classList.remove("active");

if(!e.dataTransfer.files.length)return;

const tab=current();

for(const file of e.dataTransfer.files){
try{
await puter.fs.upload(
file,
tab.path,
{dedupeName:true}
);

print("uploaded: "+file.name);
}catch(err){
print(
"error: "+(err.message||"upload failed"),
"error"
);
}
}

await load();
});

async function start(){
try{
if(!puter.auth.isSignedIn()){
await puter.auth.signIn();
}

createTab();

}catch(e){
console.error(e);
}
}

start();
</script>
</body>
</html>
