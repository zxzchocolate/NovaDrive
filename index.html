```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaDrive</title>

<script src="https://js.puter.com/v2/"></script>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #0b0d12;
        --panel: #11141b;
        --panel2: #171a22;
        --border: #272c38;
        --text: #f5f7fb;
        --muted: #9299a8;
        --accent: #7c5cff;
        --accent2: #6244e8;
        --danger: #ff5d6c;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        display: flex;
        height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
        width: 245px;
        background: #0d1016;
        border-right: 1px solid var(--border);
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 800;
        padding: 0 10px 25px;
    }

    .logo-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #8d6cff, #5c3ee9);
        display: grid;
        place-items: center;
        font-weight: 900;
    }

    .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .nav button {
        background: transparent;

        text-align: left;

    .nav button:hover,
    .nav button.active {

    .storage {
        margin-top: auto;

    .main {

    .icon-btn:hover {

    .user {
        width: 36px;
        height: 36px;

    .content {
        flex: 1;

    .toolbar {
        display: flex;
        align-items: center;

    .breadcrumb {
        font-size: 14px;
        color: var(--muted);

    .breadcrumb span {

    .primary {
        border: 0;
        background: var(--accent);
        color: white;
        padding: 10px 15px;
        border-radius: 9px;

    .primary:hover {
        background: var(--accent2);

    .secondary {

    .more {

    .more:hover {
        color: white;

    .empty {
        text-align: center;
        padding: 80px 20px;

    }

    .empty-icon {
        font-size: 55px;
        margin-bottom: 12px;
    }

    .loading {
        text-align: center;

    }

    /* MODAL */

    .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.65);
        backdrop-filter: blur(5px);
        place-items: center;
        z-index: 50;
    }

    .modal-bg.show {
        display: grid;
    }

    .modal {
        width: min(420px, calc(100vw - 30px));
        background: #151820;
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 22px;
        box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }

    .modal h2 {
        margin: 0 0 17px;

    }

        border-radius: 9px;

    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;

    }

    @media(max-width: 700px) {
        .sidebar {
            width: 65px;

        }

        .logo {
            justify-content: center;
            padding-left: 0;

        }

        .logo span,
        .nav button span,
        .storage {
            display: none;
        }

        .nav button {
            text-align: center;
            font-size: 20px;
        }

        .content {
            padding: 16px;
        }

        .topbar {
            padding: 0 14px;
        }

        .file-grid {
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        }
    }
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">N</div>
            <span>NovaDrive</span>
        </div>

        <div class="nav">
            <button class="active" onclick="goHome()">☁️ <span>My Drive</span></button>
            <button onclick="showShared()">👥 <span>Shared</span></button>
            <button onclick="showRecent()">🕘 <span>Recent</span></button>
        </div>

        <div class="storage">
            <div class="storage-title">NovaDrive Storage</div>
            <div class="storage-bar">
                <div class="storage-fill"></div>
            </div>
            <div class="storage-text">Storage is provided by Puter</div>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">

            <div class="search">
                <div class="search-icon">⌕</div>
                <input
                    id="searchInput"
                    placeholder="Search your files..."
                    oninput="renderFiles()"
                >
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">☼</button>
                <div class="user" id="userAvatar">N</div>
            </div>

        </header>

        <section class="content">

            <div class="toolbar">

                <div class="breadcrumb" id="breadcrumb">
                    <span onclick="goHome()">My Drive</span>
                </div>

                <button class="secondary" onclick="newFolder()">＋ Folder</button>
                <button class="primary" onclick="document.getElementById('fileInput').click()">
                    ↑ Upload
                </button>

                <input
                    id="fileInput"
                    type="file"
                    multiple
                    hidden
                    onchange="uploadFiles(this.files)"
                >

            </div>

            <div class="section-title" id="sectionTitle">My Drive</div>

            <div id="fileArea">
                <div class="loading">Loading your files...</div>
            </div>

        </section>

    </main>

</div>

<!-- MODAL -->

<div class="modal-bg" id="modalBg">
    <div class="modal">

        <h2 id="modalTitle">New Folder</h2>

        <input
            id="modalInput"
            placeholder="Folder name"
            autocomplete="off"
        >

        <div class="modal-actions">
            <button class="secondary" onclick="closeModal()">Cancel</button>
            <button class="primary" onclick="submitModal()">Create</button>
        </div>

    </div>
</div>

<script>
let currentPath = "";
let currentFiles = [];
let modalMode = "folder";
let modalTarget = null;

async function init() {
    try {
        if (puter.auth && !puter.auth.isSignedIn()) {
            await puter.auth.signIn();
        }

        const user = await puter.auth.getUser();

        if (user) {
            const name = user.username || user.email || "N";
            document.getElementById("userAvatar").textContent =
                name.charAt(0).toUpperCase();
        }

        await loadFiles();
    } catch (error) {
        console.error(error);
        showError(error);
    }
}

async function loadFiles() {
    const area = document.getElementById("fileArea");

    area.innerHTML = `<div class="loading">Loading...</div>`;

    try {
        currentFiles = await puter.fs.readdir(currentPath || ".");

        renderFiles();
        updateBreadcrumb();

    } catch (error) {
        console.error(error);
        area.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <div>Couldn't load this folder.</div>
                <button class="secondary" style="margin-top:15px" onclick="loadFiles()">
                    Try again
                </button>
            </div>
        `;
    }
}

function renderFiles() {

    const area = document.getElementById("fileArea");
    const query = document.getElementById("searchInput").value
        .toLowerCase()
        .trim();

    let files = currentFiles.filter(file => {
        const name = file.name || "";
        return name.toLowerCase().includes(query);
    });

    files.sort((a, b) => {

        const ad = a.is_dir || a.type === "directory";
        const bd = b.is_dir || b.type === "directory";

        if (ad && !bd) return -1;
        if (!ad && bd) return 1;

        return (a.name || "").localeCompare(b.name || "");
    });

    if (!files.length) {
        area.innerHTML = `
            <div class="empty">
                <div class="empty-icon">☁️</div>
                <div>${query ? "No matching files." : "This folder is empty."}</div>
            </div>
        `;
        return;
    }

    const grid = document.createElement("div");
    grid.className = "file-grid";

    for (const file of files) {

        const isDir =
            file.is_dir ||
            file.type === "directory" ||
            file.type === "dir";

        const card = document.createElement("div");
        card.className = "file-card";

        card.onclick = () => {

            if (isDir) {
                openFolder(file.name);
            }

        };

        card.ondblclick = () => {
            if (!isDir) {
                downloadFile(file);
            }
        };

        const icon = isDir
            ? "📁"
            : getFileIcon(file.name);

        const size = isDir
            ? "Folder"
            : formatBytes(file.size);

        card.innerHTML = `
            <button class="more" onclick="event.stopPropagation(); openMenu(${JSON.stringify(file.name).replace(/"/g, '&quot;')}, ${isDir})">
                ⋮
            </button>

            <div class="file-icon">${icon}</div>
            <div class="file-name" title="${escapeHtml(file.name)}">
                ${escapeHtml(file.name)}
            </div>
            <div class="file-meta">${size}</div>
        `;

        grid.appendChild(card);
    }

    area.innerHTML = "";
    area.appendChild(grid);
}

function getFileIcon(name) {

    const ext = name.split(".").pop().toLowerCase();

    const icons = {
        png: "🖼️",
        jpg: "🖼️",
        jpeg: "🖼️",
        gif: "🖼️",
        webp: "🖼️",
        svg: "🎨",

        mp3: "🎵",
        wav: "🎵",
        ogg: "🎵",
        flac: "🎵",

        mp4: "🎬",
        mov: "🎬",
        webm: "🎬",
        mkv: "🎬",

        pdf: "📕",

        zip: "📦",
        rar: "📦",
        "7z": "📦",

        js: "🟨",
        html: "🌐",
        css: "🎨",
        json: "🧩",

        txt: "📄",
        md: "📝",

        doc: "📘",
        docx: "📘",

        xls: "📗",
        xlsx: "📗",

        ppt: "📙",
        pptx: "📙"
    };

    return icons[ext] || "📄";
}

function formatBytes(bytes) {

    if (!bytes || bytes === 0) return "0 B";

    const units = ["B", "KB", "MB", "GB", "TB"];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));

    return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
}

async function uploadFiles(files) {

    if (!files.length) return;

    try {

        await puter.fs.upload(
            files,
            currentPath || ".",
            {
                dedupeName: true
            }
        );

        await loadFiles();

    } catch (error) {
        console.error(error);
        alert("Upload failed: " + error.message);
    }

    document.getElementById("fileInput").value = "";
}

async function newFolder() {

    openModal(
        "New Folder",
        "Folder name",
        "folder"
    );
}

function openModal(title, placeholder, mode, target = null) {

    modalMode = mode;
    modalTarget = target;

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalInput").placeholder = placeholder;
    document.getElementById("modalInput").value = "";

    document
        .getElementById("modalBg")
        .classList.add("show");

    setTimeout(() => {
        document.getElementById("modalInput").focus();
    }, 50);
}

function closeModal() {
    document.getElementById("modalBg").classList.remove("show");
}

async function submitModal() {

    const input = document.getElementById("modalInput");
    const name = input.value.trim();

    if (!name) return;

    try {

        if (modalMode === "folder") {

            const path = joinPath(currentPath, name);

            await puter.fs.mkdir(path);

        } else if (modalMode === "rename") {

            const oldPath = joinPath(currentPath, modalTarget);
            const newPath = joinPath(currentPath, name);

            await puter.fs.rename(oldPath, newPath);
        }

        closeModal();
        await loadFiles();

    } catch (error) {
        alert(error.message || "Operation failed.");
    }
}

async function openFolder(name) {

    currentPath = joinPath(currentPath, name);

    await loadFiles();
}

function goHome() {

    currentPath = "";
    document.getElementById("searchInput").value = "";

    loadFiles();
}

function updateBreadcrumb() {

    const breadcrumb = document.getElementById("breadcrumb");

    const parts = currentPath
        ? currentPath.split("/").filter(Boolean)
        : [];

    let html = `<span onclick="goHome()">My Drive</span>`;

    let path = "";

    parts.forEach((part, index) => {

        path = path
            ? path + "/" + part
            : part;

        const safePath = path.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

        html += `
            <span style="margin:0 7px">›</span>
            <span onclick="navigateTo('${safePath}')">
                ${escapeHtml(part)}
            </span>
        `;
    });

    breadcrumb.innerHTML = html;
    document.getElementById("sectionTitle").textContent =
        parts.length ? parts[parts.length - 1] : "My Drive";
}

function navigateTo(path) {

    currentPath = path;
    loadFiles();
}

function joinPath(a, b) {

    if (!a) return b;

    return a.replace(/\/$/, "") + "/" + b;
}

async function downloadFile(file) {

    try {

        const path = file.path || joinPath(currentPath, file.name);

        const url = await puter.fs.getReadURL(path);

        const a = document.createElement("a");

        a.href = url;
        a.download = file.name;
        a.target = "_blank";

        document.body.appendChild(a);
        a.click();
        a.remove();

    } catch (error) {
        alert("Couldn't download file: " + error.message);
    }
}

function openMenu(name, isDir) {

    const action = prompt(
        `${name}\n\n` +
        `Type one of:\n` +
        `rename\n` +
        `${isDir ? "" : "download\n"}` +
        `delete`
    );

    if (!action) return;

    if (action.toLowerCase() === "rename") {

        openModal(
            "Rename",
            "New name",
            "rename",
            name
        );

    } else if (
        action.toLowerCase() === "download" &&
        !isDir
    ) {

        const file = currentFiles.find(f => f.name === name);

        if (file) downloadFile(file);

    } else if (action.toLowerCase() === "delete") {

        deleteItem(name);
    }
}

async function deleteItem(name) {

    if (!confirm(`Delete "${name}"?`)) return;

    try {

        await puter.fs.delete(
            joinPath(currentPath, name)
        );

        await loadFiles();

    } catch (error) {
        alert("Delete failed: " + error.message);
    }
}

async function showShared() {

    try {

        const shared = await puter.fs.listShared();

        currentFiles = shared || [];

        document.getElementById("sectionTitle").textContent =
            "Shared with me";

        document.getElementById("breadcrumb").innerHTML =
            `<span onclick="goHome()">My Drive</span>
             <span style="margin:0 7px">›</span>
             <span>Shared</span>`;

        renderFiles();

    } catch (error) {

        alert("Couldn't load shared files: " + error.message);
    }
}

async function showRecent() {

    // Puter does not expose a universal "recent files" filesystem
    // endpoint, so NovaDrive currently shows the current directory.
    await goHome();

    document.getElementById("sectionTitle").textContent =
        "Recent";
}

function toggleTheme() {

    const light = document.body.dataset.theme === "light";

    if (!light) {

        document.body.dataset.theme = "light";

        document.documentElement.style.setProperty("--bg", "#f4f5f8");
        document.documentElement.style.setProperty("--panel", "#ffffff");
        document.documentElement.style.setProperty("--panel2", "#eef0f5");
        document.documentElement.style.setProperty("--border", "#dfe2e8");
        document.documentElement.style.setProperty("--text", "#151821");
        document.documentElement.style.setProperty("--muted", "#697080");

    } else {

        document.body.dataset.theme = "dark";

        document.documentElement.style.setProperty("--bg", "#0b0d12");
        document.documentElement.style.setProperty("--panel", "#11141b");
        document.documentElement.style.setProperty("--panel2", "#171a22");
        document.documentElement.style.setProperty("--border", "#272c38");
        document.documentElement.style.setProperty("--text", "#f5f7fb");
        document.documentElement.style.setProperty("--muted", "#9299a8");
    }
}

function showError(error) {

    document.getElementById("fileArea").innerHTML = `
        <div class="empty">
            <div class="empty-icon">⚠️</div>
            <div>${escapeHtml(error.message || "Something went wrong.")}</div>
        </div>
    `;
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

document.getElementById("modalInput").addEventListener("keydown", e => {

    if (e.key === "Enter") {
        submitModal();
    }

    if (e.key === "Escape") {
        closeModal();
    }
});

document.getElementById("modalBg").addEventListener("click", e => {

    if (e.target.id === "modalBg") {
        closeModal();
    }
});

init();
</script>

<footer style="
    position:fixed;
    bottom:7px;
    right:12px;
    font-size:10px;
    color:#697080;
    pointer-events:none;
">
    Powered by Puter
</footer>

</body>
</html>
